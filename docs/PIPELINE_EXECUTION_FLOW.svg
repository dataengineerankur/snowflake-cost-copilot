<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .step-box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .step-num { fill: #1976d2; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
      .step-title { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; fill: #0d47a1; }
      .step-desc { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
      .step-detail { font-family: Arial, sans-serif; font-size: 10px; fill: #666; }
      .arrow { stroke: #1976d2; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
      .title { font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #0d47a1; }
      .section-title { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #fff; }
    </style>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="35" class="title" text-anchor="middle">Complete Pipeline Execution Flow</text>
  <text x="600" y="55" class="step-detail" text-anchor="middle">$ python python/run_copilot.py --days 7 --mode DRY_RUN --ai on --verify on</text>

  <!-- STEP 1 -->
  <rect x="50" y="80" width="1100" height="110" class="step-box" rx="8"/>
  <circle cx="75" cy="105" r="15" class="step-num"/>
  <text x="75" y="110" class="step-num" text-anchor="middle" fill="white" font-size="16">1</text>
  <text x="110" y="100" class="step-title">COLLECTOR: Data Ingestion</text>
  <text x="110" y="118" class="step-desc">• Pull SNOWFLAKE.ACCOUNT_USAGE for last 7 days</text>
  <text x="110" y="133" class="step-desc">• Merge into FACT_QUERY, FACT_QUERY_COST, FACT_WAREHOUSE_HOURLY</text>
  <text x="110" y="148" class="step-desc">• Status: 50,000+ queries merged | Freshness: QUERY_HISTORY 2m old</text>
  <text x="930" y="135" class="step-detail" font-weight="bold" fill="#d32f2f">Output: Facts updated</text>

  <!-- Arrow -->
  <path d="M 600 190 L 600 220" class="arrow"/>

  <!-- STEP 2 -->
  <rect x="50" y="220" width="1100" height="130" class="step-box" rx="8"/>
  <circle cx="75" cy="250" r="15" class="step-num"/>
  <text x="75" y="255" class="step-num" text-anchor="middle" fill="white" font-size="16">2</text>
  <text x="110" y="245" class="step-title">RULES ENGINE: Pattern Detection (7 Rules)</text>
  <text x="110" y="263" class="step-desc">• RULE_HEAVY_JOBS: Top 10% spenders → 20 recommendations</text>
  <text x="110" y="278" class="step-desc">• RULE_SPILL: Memory pressure (>5GB) → 5 recommendations</text>
  <text x="110" y="293" class="step-desc">• RULE_PRUNING, RULE_QUEUE, RULE_COMPILE, RULE_IDLE, RULE_PIPE_NOISE</text>
  <text x="110" y="313" class="step-desc">• Status: 43 total recommendations generated with evidence JSON</text>
  <text x="930" y="280" class="step-detail" font-weight="bold" fill="#d32f2f">Output: RECOMMENDATIONS</text>

  <!-- Arrow -->
  <path d="M 600 350 L 600 380" class="arrow"/>

  <!-- STEP 3 -->
  <rect x="50" y="380" width="1100" height="100" class="step-box" rx="8"/>
  <circle cx="75" cy="405" r="15" class="step-num"/>
  <text x="75" y="410" class="step-num" text-anchor="middle" fill="white" font-size="16">3</text>
  <text x="110" y="400" class="step-title">ENRICHMENT: Add Context</text>
  <text x="110" y="418" class="step-desc">• OWNER_MAPPER: Map query_tags to teams/owners (38 owners identified)</text>
  <text x="110" y="433" class="step-desc">• LINEAGE_BUILDER: Build query→table→warehouse graph (2,500 edges)</text>
  <text x="110" y="448" class="step-desc">• PLAYBOOK_ENGINE: Seed best-practice remediation steps</text>
  <text x="930" y="420" class="step-detail" font-weight="bold" fill="#d32f2f">Output: Ownership + Graph</text>

  <!-- Arrow -->
  <path d="M 600 480 L 600 510" class="arrow"/>

  <!-- STEP 4 -->
  <rect x="50" y="510" width="1100" height="100" class="step-box" rx="8"/>
  <circle cx="75" cy="535" r="15" class="step-num"/>
  <text x="75" y="540" class="step-num" text-anchor="middle" fill="white" font-size="16">4</text>
  <text x="110" y="530" class="step-title">ANOMALY & BUDGET: Trend Analysis</text>
  <text x="110" y="548" class="step-desc">• ANOMALY_DETECTOR: Compare 7-day vs rolling 30-day baseline → 5 spikes detected</text>
  <text x="110" y="563" class="step-desc">• BUDGET_GUARDRAILS: Check monthly spend vs budget → 1 warning (87% utilized)</text>
  <text x="110" y="578" class="step-desc">• Create alert records for escalation</text>
  <text x="930" y="550" class="step-detail" font-weight="bold" fill="#d32f2f">Output: Anomalies + Alerts</text>

  <!-- Arrow -->
  <path d="M 600 610 L 600 640" class="arrow"/>

  <!-- STEP 5 -->
  <rect x="50" y="640" width="1100" height="140" class="step-box" rx="8"/>
  <circle cx="75" cy="670" r="15" class="step-num"/>
  <text x="75" y="675" class="step-num" text-anchor="middle" fill="white" font-size="16">5</text>
  <text x="110" y="660" class="step-title">AI RECOMMENDER: Enhance with LLM (Optional)</text>
  <text x="110" y="678" class="step-desc">• For each of 43 recommendations, call OpenRouter API (if OPENROUTER_API_KEY set)</text>
  <text x="110" y="693" class="step-desc">• LLM analyzes evidence + generates contextual explanations</text>
  <text x="110" y="708" class="step-desc">• Template fallback if API unavailable (works offline)</text>
  <text x="110" y="723" class="step-desc">• Status: 43 AI recommendations (20 LLM-enhanced, 23 templates) | Confidence: 0.65-0.95</text>
  <text x="930" y="690" class="step-detail" font-weight="bold" fill="#d32f2f">Output: AI_RECOMMENDATIONS</text>

  <!-- Arrow -->
  <path d="M 600 780 L 600 810" class="arrow"/>

  <!-- STEP 6 -->
  <rect x="50" y="810" width="1100" height="130" class="step-box" rx="8"/>
  <circle cx="75" cy="840" r="15" class="step-num"/>
  <text x="75" y="845" class="step-num" text-anchor="middle" fill="white" font-size="16">6</text>
  <text x="110" y="830" class="step-title">POLICY ENGINE & EXECUTOR: Apply (or Queue)</text>
  <text x="110" y="848" class="step-desc">• For each recommendation, check policy gates:</text>
  <text x="110" y="863" class="step-desc">  ✓ Risk = LOW? ✓ Approved? ✓ On allowlist? ✓ Safe DDL pattern?</text>
  <text x="110" y="878" class="step-desc">• DRY_RUN mode: Queue SQL without executing → Log to console</text>
  <text x="110" y="893" class="step-desc">• APPLY mode: Execute if policy passes → Log action + rollback path</text>
  <text x="110" y="908" class="step-desc">• Status: 0 actions applied (DRY_RUN mode)</text>
  <text x="930" y="860" class="step-detail" font-weight="bold" fill="#d32f2f">Output: ACTION_LOG</text>

  <!-- Arrow -->
  <path d="M 600 940 L 600 970" class="arrow"/>

  <!-- STEP 7 -->
  <rect x="50" y="970" width="1100" height="110" class="step-box" rx="8"/>
  <circle cx="75" cy="995" r="15" class="step-num"/>
  <text x="75" y="1000" class="step-num" text-anchor="middle" fill="white" font-size="16">7</text>
  <text x="110" y="990" class="step-title">SCORING & PRIORITIZATION: Rank Recommendations</text>
  <text x="110" y="1008" class="step-desc">• Score by impact (credits saved), urgency, complexity</text>
  <text x="110" y="1023" class="step-desc">• Update confidence scores based on evidence quality + AI input</text>
  <text x="110" y="1038" class="step-desc">• Status: 43 recommendations ranked | Top 10 extracted</text>
  <text x="930" y="1010" class="step-detail" font-weight="bold" fill="#d32f2f">Output: Ranked Recs</text>

  <!-- Arrow -->
  <path d="M 600 1080 L 600 1110" class="arrow"/>

  <!-- STEP 8 -->
  <rect x="50" y="1110" width="1100" height="100" class="step-box" rx="8"/>
  <circle cx="75" cy="1135" r="15" class="step-num"/>
  <text x="75" y="1140" class="step-num" text-anchor="middle" fill="white" font-size="16">8</text>
  <text x="110" y="1130" class="step-title">VERIFICATION: Measure Impact</text>
  <text x="110" y="1148" class="step-desc">• Compare pre/post metrics for applied actions:</text>
  <text x="110" y="1163" class="step-desc">  - Credits consumed, spill volume, query time, queue delays, execution time</text>
  <text x="110" y="1178" class="step-desc">• Status: 0 verification records (no APPLY mode) | Would compare if changes applied</text>
  <text x="930" y="1150" class="step-detail" font-weight="bold" fill="#d32f2f">Output: VERIFICATION_RESULTS</text>

  <!-- Arrow -->
  <path d="M 600 1210 L 600 1240" class="arrow"/>

  <!-- STEP 9 -->
  <rect x="50" y="1240" width="1100" height="100" class="step-box" rx="8"/>
  <circle cx="75" cy="1265" r="15" class="step-num"/>
  <text x="75" y="1270" class="step-num" text-anchor="middle" fill="white" font-size="16">9</text>
  <text x="110" y="1260" class="step-title">RECURRENCE MEMORY: Track Chronic Offenders</text>
  <text x="110" y="1278" class="step-desc">• Update 30-day window to identify recurring issues</text>
  <text x="110" y="1293" class="step-desc">• Track which recommendations worked → higher priority next time</text>
  <text x="110" y="1308" class="step-desc">• Status: 8 rules matched recurring patterns | Chronic offender list updated</text>
  <text x="930" y="1280" class="step-detail" font-weight="bold" fill="#d32f2f">Output: Memory + Insights</text>

  <!-- Arrow -->
  <path d="M 600 1340 L 600 1370" class="arrow"/>

  <!-- FINAL OUTPUT -->
  <rect x="50" y="1370" width="1100" height="100" class="step-box" rx="8" fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="110" y="1390" class="step-title" fill="#1b5e20">OUTPUTS READY</text>
  <text x="110" y="1408" class="step-desc">• Console: Top 10 heavy tags, recommendations, anomalies, SQL snippets</text>
  <text x="110" y="1423" class="step-desc">• Chat API: Available at http://127.0.0.1:8000 (FastAPI docs)</text>
  <text x="110" y="1438" class="step-desc">• Streamlit UI: streamlit run ui/app.py | Next.js: cd web && npm run dev</text>
  <text x="110" y="1453" class="step-desc">• Database: COST_COPILOT schema ready for exploration</text>
</svg>